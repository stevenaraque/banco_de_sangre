spring.application.name=blood-bank

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/blood_bank_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1057585950

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Puerto
server.port=8080
# Configuración de archivos multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Ruta donde se guardarán las firmas (relativa al proyecto)
app.upload.dir=uploads/firmas